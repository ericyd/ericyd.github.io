<!doctype html>
<html lang="en">
  <head>
    <!-- 
      Redirect
      /bar https://www.youtube.com/watch?v=dQw4w9WgXcQ
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bar Menu</title>
  </head>
  <body style="scrollbar-gutter: stable; margin: 0">
    <div class="video-player" data-src="https://res.cloudinary.com/ericyd/video/upload/v1771726877/rick-astley-never-gonna-give-you-up_gzaxbo.mp4">
      <video
        class="video-player__video"
        playsinline
        muted
        loop
      ></video>
      <button type="button" class="video-player__unmute-overlay" id="unmuteOverlay" aria-label="Tap to unmute">
        Tap to unmute
      </button>
      <div class="video-player__controls">
        <button type="button" class="video-player__btn" id="playPause" aria-label="Play / Pause">▶</button>
        <input type="range" class="video-player__progress" id="progress" min="0" max="100" value="0" aria-label="Seek" />
        <button type="button" class="video-player__btn" id="mute" aria-label="Mute / Unmute">🔊</button>
        <input type="range" class="video-player__volume" id="volume" min="0" max="100" value="100" aria-label="Volume" />
      </div>
    </div>

    <style>
      .video-player {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .video-player__video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .video-player__unmute-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.5);
        border: none;
        color: #fff;
        font-size: 1.25rem;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }
      .video-player__unmute-overlay:hover {
        background: rgba(0, 0, 0, 0.4);
      }
      .video-player__unmute-overlay.is-dismissed {
        pointer-events: none;
        opacity: 0;
      }
      .video-player__controls {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        background: linear-gradient(transparent, rgba(0,0,0,0.8));
        color: #fff;
      }
      .video-player__btn {
        background: transparent;
        border: none;
        color: inherit;
        cursor: pointer;
        padding: 0.25rem;
        font-size: 1.25rem;
      }
      .video-player__btn:hover { opacity: 0.9; }
      .video-player__progress {
        flex: 1;
        height: 6px;
        -webkit-appearance: none;
        appearance: none;
        background: rgba(255,255,255,0.3);
        border-radius: 3px;
      }
      .video-player__progress::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
      }
      .video-player__volume {
        width: 80px;
        height: 6px;
        -webkit-appearance: none;
        appearance: none;
        background: rgba(255,255,255,0.3);
        border-radius: 3px;
      }
      .video-player__volume::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
      }
    </style>

    <script>
      (function () {
        const container = document.querySelector('.video-player');
        const video = container.querySelector('.video-player__video');
        const playPauseBtn = document.getElementById('playPause');
        const progressInput = document.getElementById('progress');
        const muteBtn = document.getElementById('mute');
        const volumeInput = document.getElementById('volume');
        const unmuteOverlay = document.getElementById('unmuteOverlay');

        const src = container.dataset.src;
        if (src) {
          video.src = src;
          video.muted = true;
          video.autoplay = true;
          video.play().catch(function () {});
        }

        unmuteOverlay.addEventListener('click', function () {
          video.muted = false;
          unmuteOverlay.classList.add('is-dismissed');
          muteBtn.textContent = '🔊';
          volumeInput.disabled = false;
          volumeInput.value = video.volume * 100;
        });

        video.addEventListener('timeupdate', function () {
          if (video.duration && isFinite(video.duration)) {
            progressInput.value = (video.currentTime / video.duration) * 100;
          }
        });

        video.addEventListener('play', function () {
          playPauseBtn.textContent = '⏸';
        });
        video.addEventListener('pause', function () {
          playPauseBtn.textContent = '▶';
        });

        playPauseBtn.addEventListener('click', function () {
          if (video.paused) {
            video.play();
          } else {
            video.pause();
          }
        });

        progressInput.addEventListener('input', function () {
          const t = (Number(progressInput.value) / 100) * video.duration;
          if (isFinite(t)) video.currentTime = t;
        });

        muteBtn.addEventListener('click', function () {
          video.muted = !video.muted;
          muteBtn.textContent = video.muted ? '🔇' : '🔊';
          volumeInput.disabled = video.muted;
          volumeInput.value = video.muted ? 0 : video.volume * 100;
        });

        volumeInput.addEventListener('input', function () {
          video.muted = false;
          video.volume = Number(volumeInput.value) / 100;
          muteBtn.textContent = video.volume === 0 ? '🔇' : '🔊';
        });
      })();
    </script>
  </body>
</html>
